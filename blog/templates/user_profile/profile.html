{% extends "layout/main_layout.html" %}
{% block content %}
<div class="row">
    <div class="col-md-10 col-md-offset-1"> <div class="panel panel-default">

            <div class="panel-heading">
                <h3 class="panel-title">
                    <span class="glyphicon glyphicon-user"></span> Твій профіль </h3>
            </div>

            <div class="panel-body">
                <ul class="list-group list-group-flush">
                    <li class="list-group-item">
                        <strong>Логін:</strong>
                        <span class="pull-right">{{ user.username }}</span> </li>

                    <li class="list-group-item">
                        <strong>Email:</strong>
                        <span class="pull-right text-muted italic">{{ user.email }}</span>
                    </li>

                    <li class="list-group-item">
                        <strong>Зареєстрований:</strong>
                        <span class="pull-right">{{ user.date_joined|date:"d.m.Y" }}</span>
                    </li>
                </ul>
            </div>

            <div class="panel-footer text-right">
                <a href="#" class="btn btn-primary btn-sm">Редагувати</a>
            </div>
        </div>
    </div>
</div>

{% endblock %}
