{% extends "layout/main_layout.html" %}
{% load crispy_forms_tags %}

{% block content %}


<h2>Login</h2>
<form method="POST">
    {% csrf_token %}
    <input type="text" name="username" placeholder="Username" class="form-control mb-2">
    <input type="password" name="password" placeholder="Password" class="form-control mb-2">
    <input type="password" name="confirm_password" placeholder="Confirm Password" class="form-control mb-2">
    <input type="email" name="email" placeholder="Email" class="form-control mb-2">
    <input type="text" name="first_name" placeholder="first_name" class="form-control mb-2">
    <input type="text" name="last_name" placeholder="last_name" class="form-control mb-2">
    <input type="submit" class="btn btn-primary" value="Login">
</form>


{% endblock %}
